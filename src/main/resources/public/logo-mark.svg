<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EventOS">
  <title>EventOS</title>
  <!-- Um "E" feito de blocos de tempo: o eixo e três sessões de durações diferentes. O bloco do meio é a sessão em andamento. -->
  <rect x="8" y="8" width="9" height="48" rx="2.5" fill="#14222b"/>
  <rect x="22" y="8" width="34" height="10" rx="2.5" fill="#14222b"/>
  <rect x="22" y="27" width="22" height="10" rx="2.5" fill="#0c5560"/>
  <rect x="22" y="46" width="28" height="10" rx="2.5" fill="#14222b"/>
</svg>
